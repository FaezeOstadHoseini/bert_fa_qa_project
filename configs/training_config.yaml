# Model Configuration
model:
  pretrained_name: "HooshvareLab/bert-fa-base-uncased"
  max_length: 64
  stride: 16

# Training Configuration
training:
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-5
  num_epochs: 3
  warmup_steps: 0
  weight_decay: 0.01

# Data Configuration
data:
  dataset_name: "SajjadAyoubi/persian_qa"
  sample_size: 100
  test_size: 0.2

# Logging Configuration
logging:
  logging_dir: "logs/"
  logging_steps: 10

# Output Configuration
output:
  output_dir: "./bert-fa-qa-results"
  best_model_dir: "./bert-fa-qa-results/best_model"
